
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iSkillsMasters CMS</title><style>
:root{--blue:#1e88e5;--orange:#f57c00;--navy:#0f172a;--bg:#f6f8fc;--line:#e2e8f0;--muted:#64748b;--green:#10b981}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#111827}.top{height:64px;background:var(--navy);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.top b{font-size:20px}.top a{color:#fff;text-decoration:none;font-weight:800;font-size:12px}.wrap{max-width:1400px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 30px #0f172a12}.menu{display:grid;gap:8px;margin-top:15px}.menu button{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;font-weight:850}.menu button.active{background:#eff6ff;border-color:#60a5fa;color:#1d4ed8}.status{background:#ecfdf5;color:#047857;padding:9px 11px;border-radius:9px;font-size:12px;font-weight:900;display:flex;justify-content:space-between;margin-bottom:14px}.fields{display:grid;gap:11px}.field label{display:block;font-size:11px;text-transform:uppercase;font-weight:900;color:#64748b;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:86px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:900}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.green{background:var(--green);color:#fff;border-color:var(--green)}.danger{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.muted{font-size:12px;color:var(--muted);line-height:1.5}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:11px}.item b{display:block}.item small{color:var(--muted)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}.previewBox{margin-top:16px;border:1px dashed #cbd5e1;border-radius:12px;padding:15px;background:#f8fafc}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:12px 15px;border-radius:10px;display:none}.toast.show{display:block}@media(max-width:900px){.grid,.row{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><b>iSkillsMasters Global — CMS</b><a href="/">View Public Website →</a></div>
<div class="wrap"><div class="grid"><aside class="panel"><h3>Website Management</h3><div class="muted">Routine updates without opening source code.</div><div class="menu">
<button data-s="dashboard" class="active">Dashboard</button><button data-s="homepage">Homepage</button><button data-s="events">Events</button><button data-s="categories">Categories</button><button data-s="announcements">Announcements</button><button data-s="resources">Downloads</button><button data-s="gallery">Pictorials</button><button data-s="contact">Contact</button><button data-s="global">Global Settings</button>
</div></aside><main id="panel" class="panel"></main></div></div><div id="toast" class="toast"></div>
<script>
let active="dashboard", payload=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){payload=await fetch('/api/public').then(r=>r.json());render(active)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function render(s){
 active=s;document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
 const p=document.getElementById('panel');
 if(s==='dashboard')p.innerHTML=`<h2>Admin Dashboard</h2><p class="muted">The website is now content-managed instead of source-code-managed.</p><div class="list"><div class="item"><b>${payload.events.length} competition events</b><small>Editable dates, locations, deadlines and copy.</small></div><div class="item"><b>${payload.categories.length} category records</b><small>Editable tracks, tiers, ages and descriptions.</small></div><div class="item"><b>${payload.resources.length} downloadable resources</b><small>Upload and remove directly from the CMS.</small></div><div class="item"><b>${payload.gallery.length} gallery items</b><small>Upload and remove media without code.</small></div></div><div class="previewBox"><b>Core rule:</b><div class="muted">Code controls the design. The CMS controls the content.</div></div>`;
 if(s==='homepage')p.innerHTML=`<h2>Homepage</h2><p class="muted">Change the public hero and finale copy.</p>${field('hero_badge','Announcement',payload.settings.hero_badge)}${field('hero_title','Hero title',payload.settings.hero_title)}${field('hero_theme','Theme',payload.settings.hero_theme)}${field('hero_description','Description',payload.settings.hero_description,true)}${field('hero_partner','Partner line',payload.settings.hero_partner,true)}<div class="row">${field('hero_cta','Primary button',payload.settings.hero_cta)}${field('hero_cta2','Secondary button',payload.settings.hero_cta2)}</div><h3 style="margin-top:20px">Grand Finale</h3>${field('finale_title','Title',payload.settings.finale_title)}${field('finale_subtitle','Subtitle',payload.settings.finale_subtitle,true)}<div class="row">${field('finale_date','Dates',payload.settings.finale_date)}${field('finale_venue','Venue',payload.settings.finale_venue)}</div><div class="actions"><button class="btn primary" onclick="saveSettings('homepage')">Save homepage</button></div>`;
 if(s==='events')eventsPage(p);
 if(s==='categories')categoriesPage(p);
 if(s==='announcements')annPage(p);
 if(s==='resources')resourcesPage(p);
 if(s==='gallery')galleryPage(p);
 if(s==='contact')p.innerHTML=`<h2>Contact</h2>${field('contact_email','Email',payload.settings.contact_email)}${field('contact_phone','Phone',payload.settings.contact_phone)}${field('contact_location','Location',payload.settings.contact_location)}<div class="actions"><button class="btn primary" onclick="saveSettings('contact')">Save contact</button></div>`;
 if(s==='global')p.innerHTML=`<h2>Global Settings</h2>${field('site_name','Site name',payload.settings.site_name)}${field('tagline','Tagline',payload.settings.tagline)}<div class="actions"><button class="btn primary" onclick="saveSettings('global')">Save global settings</button></div>`;
}
function field(id,label,val,area=false){return `<div class="field"><label>${label}</label>${area?`<textarea id="${id}">${esc(val)}</textarea>`:`<input id="${id}" value="${esc(val)}">`}</div>`}
function eventsPage(p){document.getElementById('panel').innerHTML=`<h2>Events</h2><p class="muted">Add, edit or remove event cards shown publicly.</p><table class="table"><thead><tr><th>City</th><th>Date</th><th>Deadline</th><th></th></tr></thead><tbody>${payload.events.map(e=>`<tr><td>${esc(e.city)}, ${esc(e.country)}</td><td>${esc(e.event_date)}</td><td>${esc(e.deadline)}</td><td><button class="btn" onclick="editEvent(${e.id})">Edit</button> <button class="btn danger" onclick="deleteEvent(${e.id})">Delete</button></td></tr>`).join('')}</tbody></table><div class="previewBox"><b>Add event</b><div class="row">${field('city','City','')} ${field('country','Country','')}</div><div class="row">${field('event_date','Event date','')} ${field('deadline','Deadline','')}</div>${field('description','Description','',true)}<div class="actions"><button class="btn primary" onclick="addEvent()">Add event</button></div></div>`}
function categoriesPage(){document.getElementById('panel').innerHTML=`<h2>Categories</h2><p class="muted">Manage coding and robotics tiers without touching code.</p><table class="table"><thead><tr><th>Track</th><th>Tier</th><th>Ages</th><th>Title</th><th></th></tr></thead><tbody>${payload.categories.map(c=>`<tr><td>${esc(c.track)}</td><td>${esc(c.tier)}</td><td>${esc(c.ages)}</td><td>${esc(c.title)}</td><td><button class="btn danger" onclick="deleteCategory(${c.id})">Delete</button></td></tr>`).join('')}</tbody></table>`}
function annPage(){document.getElementById('panel').innerHTML=`<h2>Announcements</h2><p class="muted">Publish timely notices without changing code.</p>${field('ann_title','Title','')}${field('ann_body','Message','',true)}<div class="actions"><button class="btn primary" onclick="addAnnouncement()">Publish announcement</button></div><div class="list" style="margin-top:16px">${payload.announcements.map(a=>`<div class="item"><b>${esc(a.title)}</b><small>${esc(a.body)}</small> <button class="btn danger" onclick="deleteAnnouncement(${a.id})">Delete</button></div>`).join('')}</div>`}
function resourcesPage(){document.getElementById('panel').innerHTML=`<h2>Downloads</h2><p class="muted">Upload official PDFs/documents.</p><form id="resourceForm" enctype="multipart/form-data"><div class="row">${field('res_title','Title','')}${field('res_desc','Description','')}</div><div class="field"><label>File</label><input id="res_file" type="file"></div><div class="actions"><button class="btn primary">Upload resource</button></div></form><div class="list" style="margin-top:16px">${payload.resources.map(r=>`<div class="item"><b>${esc(r.title)}</b><small>${esc(r.filename)}</small> <button class="btn danger" onclick="deleteResource(${r.id})">Delete</button></div>`).join('')}</div></div>`;document.getElementById('resourceForm').onsubmit=uploadResource}
function galleryPage(){document.getElementById('panel').innerHTML=`<h2>Pictorials</h2><p class="muted">Upload event images and manage the gallery.</p><form id="galleryForm" enctype="multipart/form-data"><div class="row">${field('gal_album','Album','')}${field('gal_caption','Caption','')}</div><div class="field"><label>Image</label><input id="gal_file" type="file" accept="image/*"></div><div class="actions"><button class="btn primary">Upload image</button></div></form><div class="list" style="margin-top:16px">${payload.gallery.map(g=>`<div class="item"><b>${esc(g.album)}</b><small>${esc(g.caption)} • ${esc(g.filename)}</small> <button class="btn danger" onclick="deleteGallery(${g.id})">Delete</button></div>`).join('')}</div>`;document.getElementById('galleryForm').onsubmit=uploadGallery}
async function api(url,opt={}){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function saveSettings(){const keys=['hero_badge','hero_title','hero_theme','hero_description','hero_partner','hero_cta','hero_cta2','finale_title','finale_subtitle','finale_date','finale_venue','contact_email','contact_phone','contact_location','site_name','tagline'];const body={};keys.forEach(k=>{const e=document.getElementById(k);if(e)body[k]=e.value});await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await load();toast('Saved')}
async function addEvent(){const body={city:city.value,country:country.value,event_date:event_date.value,deadline:deadline.value,description:description.value,accent:'blue'};await api('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await load();toast('Event added')}
async function deleteEvent(id){await api('/api/events/'+id,{method:'DELETE'});await load();toast('Event deleted')}
async function deleteCategory(id){await api('/api/categories/'+id,{method:'DELETE'});await load();toast('Category deleted')}
async function addAnnouncement(){await api('/api/announcements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:ann_title.value,body:ann_body.value,published:true})});await load();toast('Published')}
async function deleteAnnouncement(id){await api('/api/announcements/'+id,{method:'DELETE'});await load();toast('Deleted')}
async function uploadResource(e){e.preventDefault();const fd=new FormData();fd.append('title',res_title.value);fd.append('description',res_desc.value);fd.append('file',res_file.files[0]);await api('/api/upload/resource',{method:'POST',body:fd});await load();toast('Uploaded')}
async function deleteResource(id){await api('/api/resources/'+id,{method:'DELETE'});await load();toast('Deleted')}
async function uploadGallery(e){e.preventDefault();const fd=new FormData();fd.append('album',gal_album.value);fd.append('caption',gal_caption.value);fd.append('file',gal_file.files[0]);await api('/api/upload/gallery',{method:'POST',body:fd});await load();toast('Uploaded')}
async function deleteGallery(id){await api('/api/gallery/'+id,{method:'DELETE'});await load();toast('Deleted')}
document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>render(b.dataset.s));load();
</script></body></html>
