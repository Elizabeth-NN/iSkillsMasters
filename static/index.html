
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="title">iSkillsMasters Global</title><style>
:root{--blue:#1e88e5;--orange:#f57c00;--navy:#0f172a;--slate:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:#0f172a;background:#fff}button,a{font:inherit}
nav{position:sticky;top:0;z-index:10;height:64px;background:#1e88e5;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 4px 16px #0f172a18}.brand{font-size:21px;font-weight:900}.brand span{color:#ffd180}.links{display:flex;gap:18px;font-size:12px;font-weight:800}.links a{color:#fff;text-decoration:none}
.hero{padding:74px 24px 62px;text-align:center;background:linear-gradient(135deg,#244fbe,#1e88e5);color:#fff}.badge{display:inline-block;padding:7px 12px;border:1px solid #ffffff55;border-radius:999px;font-size:11px;font-weight:900}.hero h1{font-size:64px;line-height:.95;margin:18px 0 8px}.hero h1 span{color:#ff9638}.hero h2{font-size:20px;margin:0 0 14px}.hero p{max-width:780px;margin:0 auto 16px;color:#eaf0ff;line-height:1.55}.partner{font-size:12px;color:#dfe7ff;max-width:800px;margin:0 auto 20px}.cta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.cta a{padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:900}.cta .main{background:#f57c00;color:#fff}.cta .alt{border:1px solid #ffffff66;color:#fff}
.section{padding:44px 24px;max-width:1150px;margin:auto}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#f57c00;text-align:center}.section h2{text-align:center;font-size:30px;margin:10px 0}.sub{text-align:center;color:var(--slate);max-width:750px;margin:0 auto 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.event{border-radius:18px;overflow:hidden;box-shadow:0 12px 30px #0f172a18}.event .head{padding:26px;color:#fff}.event.orange .head{background:linear-gradient(135deg,#f57c00,#da6200)}.event.blue .head{background:linear-gradient(135deg,#3d82ff,#2459d4)}.event .body{padding:18px;background:#fff}.deadline{margin-top:10px;background:#fff3c5;color:#976300;padding:9px;border-radius:9px;font-size:12px;font-weight:900}
.finale{background:#294ab0;color:#fff}.finale .inner{max-width:1050px;margin:auto}.finale .card{background:#fff;color:#0f172a;padding:18px;border-radius:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{text-align:center;padding:16px}.stat strong{display:block;color:#2461d7;font-size:36px}.stat span{font-size:11px;font-weight:900;color:#64748b;text-transform:uppercase}
.cat{padding:18px;border:1px solid #e2e8f0;border-radius:14px;background:#fff}.cat h3{margin:0 0 6px}.cat p{color:#64748b;font-size:12px;line-height:1.5}.footer{background:#0f172a;color:#cbd5e1;padding:28px 24px}.foot{max-width:1050px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:25px}.foot h4{color:#fff;margin:0 0 8px}.foot div,.foot p{font-size:12px;line-height:1.5}
@media(max-width:850px){.links{display:none}.grid,.stats,.foot{grid-template-columns:1fr}.hero h1{font-size:45px}}
</style></head><body>
<nav><div class="brand"><span id="brand">iSkills</span>Masters</div><div class="links"><a href="/">HOME</a><a href="#categories">CATEGORIES</a><a href="#downloads">DOWNLOADS</a><a href="#pictorials">PICTORIALS</a><a href="#contact">CONTACT</a><a href="/admin">ADMIN</a></div></nav>
<div id="site"></div>
<script>
async function load(){
 const d=await fetch('/api/public').then(r=>r.json());const s=d.settings;
 document.title=s.site_name;document.getElementById('brand').textContent=s.site_name.replace(/Masters.*/,'')||'iSkills';
 const events=d.events, cats=d.categories;
 document.getElementById('site').innerHTML=`
 <section class="hero"><div class="badge">${esc(s.hero_badge)}</div><h1>${esc(s.hero_title.split(' ')[0])} <span>${esc(s.hero_title.split(' ').slice(1).join(' '))}</span></h1><h2>Theme: <span style="color:#ff9638">${esc(s.hero_theme)}</span></h2><p>${esc(s.hero_description)}</p><div class="partner">${esc(s.hero_partner)}</div><div class="cta"><a class="main" href="#contact">${esc(s.hero_cta)}</a><a class="alt" href="#categories">${esc(s.hero_cta2)}</a></div></section>
 <section class="section"><div class="eyebrow">NATIONAL COMPETITIONS</div><h2>Road to the Finals</h2><div class="sub">Current event information is now managed from the CMS instead of source code.</div><div class="grid">${events.map(e=>`<div class="event ${e.accent}"><div class="head"><b>${esc(e.city)}</b><div>${esc(e.country)}</div></div><div class="body"><b>${esc(e.event_date)}</b><p style="color:#64748b;font-size:12px">${esc(e.description)}</p><div class="deadline">Registration deadline: ${esc(e.deadline)}</div></div></div>`).join('')}</div></section>
 <section id="categories" class="section" style="background:#f8fafc;max-width:none"><div style="max-width:1150px;margin:auto"><div class="eyebrow">COMPETITION CATEGORIES</div><h2>Build, compete and learn</h2><div class="grid">${cats.slice(0,8).map(c=>`<div class="cat"><h3>${esc(c.track)} — ${esc(c.tier)}</h3><div style="font-size:11px;font-weight:900;color:#2563eb">${esc(c.ages)}</div><p><b>${esc(c.title)}</b><br>${esc(c.description)}</p></div>`).join('')}</div></div></section>
 <section class="section finale"><div class="finale inner"><div class="badge">GRAND FINALE</div><h2 style="text-align:left;color:#fff">${esc(s.finale_title)}</h2><p style="color:#e2e8ff">${esc(s.finale_subtitle)}</p><div class="grid"><div class="card"><b>${esc(s.finale_date)}</b><div style="color:#64748b">${esc(s.finale_venue)}</div></div><div class="card"><b>Prizes & Scholarships</b><div style="color:#64748b">Trophies, medals, laptops, robotics kits and coding scholarships.</div></div></div></div></section>
 <section class="section"><div class="stats"><div class="stat"><strong>4</strong><span>Countries</span></div><div class="stat"><strong>2000+</strong><span>Participants</span></div><div class="stat"><strong>50+</strong><span>Schools</span></div><div class="stat"><strong>USD 8,000</strong><span>Prizes</span></div></div></section>
 <section id="contact" class="section"><div class="eyebrow">CONTACT</div><h2>Get in touch</h2><div class="sub">${esc(s.contact_email)} • ${esc(s.contact_phone)} • ${esc(s.contact_location)}</div></section>
 <footer class="footer"><div class="foot"><div><h4>${esc(s.site_name)}</h4><p>${esc(s.tagline)}</p></div><div><h4>Quick Links</h4><div>Home</div><div>Categories</div><div>Downloads</div><div>Pictorials</div></div><div><h4>Contact</h4><div>${esc(s.contact_email)}</div><div>${esc(s.contact_phone)}</div><div>${esc(s.contact_location)}</div></div></div></footer>`;
}
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));load()
</script></body></html>
